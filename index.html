<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Havana Salsa Club – Consulta de Notas</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --rojo: #C0392B;
  --rojo-dk: #8B1A1A;
  --dorado: #D4AF37;
  --crema: #FAF3E0;
  --negro: #0D0D0D;
  --verde: #1E8449;
  --naranja: #D35400;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--negro);
  color:var(--crema);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
}
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 70% 55% at 10% 90%, rgba(192,57,43,.22) 0%,transparent 58%),
    radial-gradient(ellipse 50% 45% at 90% 5%,  rgba(212,175,55,.10) 0%,transparent 55%),
    radial-gradient(ellipse 40% 35% at 50% 50%, rgba(139,26,26,.08) 0%,transparent 60%),
    var(--negro);
}
.bg::after{
  content:'';position:absolute;inset:0;
  background-image:repeating-linear-gradient(
    -45deg,transparent,transparent 60px,
    rgba(212,175,55,.018) 60px,rgba(212,175,55,.018) 61px
  );

}
.wrap{
  position:relative;z-index:1;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:2rem 1rem 5rem;
}

/* HEADER */
header{
  text-align:center;
  margin-bottom:2rem;
  animation:fadeDown .7s ease both;
}
.logo-img{
  width:min(260px,70vw);
  margin-bottom:.8rem;
  filter:drop-shadow(0 4px 24px rgba(212,175,55,.35));
}
header .tagline{
  font-size:.75rem;letter-spacing:.18em;
  text-transform:uppercase;
  color:rgba(250,243,224,.4);
}

/* CARDS */
.card{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(212,175,55,.18);
  border-radius:18px;
  padding:2rem;
  backdrop-filter:blur(14px);
  width:100%;max-width:480px;
  animation:fadeUp .55s .1s ease both;
}
.card h2{
  font-family:'Playfair Display',serif;
  font-size:1.3rem;color:var(--dorado);
  margin-bottom:.25rem;
  text-align:center;
}
.card .sub{
  font-size:.8rem;color:rgba(250,243,224,.45);
  margin-bottom:1.6rem;letter-spacing:.04em;
  text-align:center;
}

/* FORM */
.field{margin-bottom:1.15rem;}
label{
  display:block;font-size:.72rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:rgba(250,243,224,.55);margin-bottom:.4rem;
}
input,select{
  width:100%;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(212,175,55,.22);
  border-radius:9px;
  padding:.72rem 1rem;
  color:var(--crema);
  font-family:'DM Sans',sans-serif;font-size:.95rem;
  transition:border-color .2s,box-shadow .2s;
  -webkit-appearance:none;appearance:none;
}
input:focus,select:focus{
  outline:none;
  border-color:var(--dorado);
  box-shadow:0 0 0 3px rgba(212,175,55,.14);
}
select option{background:#1a1a1a;}

.btn{
  width:100%;margin-top:.4rem;
  padding:.82rem 1rem;
  background:linear-gradient(135deg,var(--rojo),var(--rojo-dk));
  color:#fff;
  font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  border:none;border-radius:9px;cursor:pointer;
  box-shadow:0 4px 22px rgba(192,57,43,.38);
  transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 30px rgba(192,57,43,.5);}
.btn:active{transform:none;}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}

.err{
  background:rgba(192,57,43,.14);
  border:1px solid rgba(192,57,43,.35);
  border-radius:8px;padding:.7rem 1rem;
  font-size:.83rem;color:#E8A49A;
  margin-top:.9rem;display:none;
}

/* LOADING */
#loading{
  display:none;flex-direction:column;align-items:center;gap:1rem;
  animation:fadeUp .4s ease both;
}
.spinner{
  width:46px;height:46px;
  border:3px solid rgba(212,175,55,.18);
  border-top-color:var(--dorado);
  border-radius:50%;
  animation:spin .75s linear infinite;
}
#loading p{color:rgba(250,243,224,.55);font-size:.88rem;}

/* RESULTADO */
#result{display:none;width:100%;max-width:600px;animation:fadeUp .5s ease both;}

.res-header{
  text-align:center;margin-bottom:1.8rem;
}
.res-header .exam-label{
  font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dorado);margin-bottom:.5rem;
}
.res-header h2{
  font-family:'Playfair Display',serif;
  font-size:clamp(1.4rem,4vw,1.9rem);color:var(--crema);
  line-height:1.15;margin-bottom:.3rem;
}
.res-header .pareja-line{
  font-size:.82rem;color:rgba(250,243,224,.45);
}
.res-header .pareja-line span{color:var(--dorado);}

/* FASE BLOCKS */
.fase{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(212,175,55,.12);
  border-radius:14px;margin-bottom:.85rem;overflow:hidden;
}
.fase-head{
  background:rgba(212,175,55,.07);
  padding:.65rem 1.2rem;
  display:flex;align-items:center;justify-content:space-between;gap:.5rem;
}
.fase-head h3{
  font-size:.72rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dorado);
}
.fase-score{
  font-family:'Playfair Display',serif;
  font-size:1.15rem;color:var(--crema);white-space:nowrap;
}
.fase-body{padding:.85rem 1.2rem;}

.row{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:.38rem 0;
  border-bottom:1px solid rgba(255,255,255,.045);
  font-size:.86rem;gap:1rem;
}
.row:last-child{border-bottom:none;}
.rl{color:rgba(250,243,224,.55);flex-shrink:0;}
.rv{color:var(--crema);font-weight:500;text-align:right;}

/* tags */
.tag{
  display:inline-block;padding:.12rem .55rem;
  border-radius:20px;font-size:.73rem;font-weight:600;
}
.t-bien    {background:rgba(30,132,73,.2);  color:#6FCF97;border:1px solid rgba(30,132,73,.3);}
.t-regular {background:rgba(211,84,0,.2);   color:#F0A04B;border:1px solid rgba(211,84,0,.3);}
.t-mal     {background:rgba(192,57,43,.2);  color:#E8A49A;border:1px solid rgba(192,57,43,.3);}

/* paso badges */
.badges{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.25rem;}
.badge{
  padding:.18rem .52rem;border-radius:6px;
  font-size:.75rem;font-weight:500;
}
.badge-malo   {background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.28);color:#E8A49A;}
.badge-regular{background:rgba(211,84,0,.15); border:1px solid rgba(211,84,0,.28); color:#F0A04B;}

/* TOTAL FINAL */
.total-box{
  background:rgba(212,175,55,.06);
  border:1px solid rgba(212,175,55,.28);
  border-radius:14px;padding:1.1rem 1.5rem;
  margin-bottom:.85rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
}
.total-box .tl{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(250,243,224,.55);}
.total-box .tn{font-family:'Playfair Display',serif;font-size:2rem;color:var(--dorado);line-height:1;}

/* BANNER */
.banner{
  border-radius:14px;padding:1.4rem;text-align:center;
  line-height:1.65;font-size:.9rem;margin-bottom:.85rem;
}
.banner.aprobado{
  background:rgba(30,132,73,.1);
  border:1px solid rgba(30,132,73,.3);color:#A8D5B5;
}
.banner.reprobado{
  background:rgba(192,57,43,.1);
  border:1px solid rgba(192,57,43,.3);color:#E8A49A;
}
.banner strong{font-size:1.05rem;display:block;margin-bottom:.5rem;}
.banner .handle{display:block;margin-top:.7rem;font-size:.75rem;letter-spacing:.1em;color:var(--dorado);opacity:.75;}

/* btn back */
.btn-back{
  display:block;width:100%;
  padding:.68rem;background:transparent;
  border:1px solid rgba(212,175,55,.2);border-radius:9px;
  color:rgba(250,243,224,.45);
  font-family:'DM Sans',sans-serif;font-size:.82rem;cursor:pointer;
  transition:border-color .2s,color .2s;letter-spacing:.05em;
}
.btn-back:hover{border-color:var(--dorado);color:var(--dorado);}

/* fecha badge */
.fecha-badge{
  display:inline-block;
  background:rgba(212,175,55,.1);
  border:1px solid rgba(212,175,55,.2);
  border-radius:20px;padding:.25rem .9rem;
  font-size:.72rem;letter-spacing:.08em;
  color:rgba(250,243,224,.6);
  margin-bottom:1.2rem;
}

footer{margin-top:2.5rem;font-size:.72rem;color:rgba(250,243,224,.18);text-align:center;letter-spacing:.07em;}

.resumen-box{
  background:rgba(212,175,55,.06);
  border:1px solid rgba(212,175,55,.25);
  border-radius:14px;
  padding:1.2rem 1.5rem;
  margin-bottom:.85rem;
}
.resumen-title{
  font-size:.72rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dorado);
  margin-bottom:.9rem;
}
.resumen-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:.42rem 0;
  border-bottom:1px solid rgba(255,255,255,.05);
  font-size:.88rem;
}
.resumen-row:last-child{border-bottom:none;}
.res-fase{color:rgba(250,243,224,.7);}
.res-pts{color:var(--crema);font-weight:600;font-family:'Playfair Display',serif;font-size:.95rem;}

@keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes fadeUp  {from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none}}
@keyframes spin    {to{transform:rotate(360deg)}}

@media(max-width:480px){
  .card,.res-header{padding:1.5rem;}
  .fase-body{padding:.7rem 1rem;}
}
</style>
</head>

// Poblar select
window.onload = () => {
  const s = document.getElementById("sel-grupo");

    const o = document.createElement("option");
    o.value = g.id; o.textContent = g.nombre; s.appendChild(o);

function showErr(msg){ const e=document.getElementById("err-box"); e.textContent=msg; e.style.display="block"; }
function hideErr(){ document.getElementById("err-box").style.display="none"; }

function parseCSV(txt){
  const lines = txt.trim().split("\n");
  const hdrs  = splitCSVLine(lines[0]);
  return lines.slice(1).filter(l=>l.trim()).map(l=>{
    const vals = splitCSVLine(l);
    const row  = {};
    hdrs.forEach((h,i)=>{ row[h.trim().toLowerCase()] = (vals[i]||"").trim(); });
    return row;
  });
}
function splitCSVLine(line){
  const res=[]; let cur="", inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){res.push(cur.replace(/^"|"$/g,'')); cur="";}
    else cur+=c;
  }
  res.push(cur.replace(/^"|"$/g,'')); return res;
}

function v(row,col){ return (row[col]||"").trim(); }
function n(row,col){ return parseFloat((v(row,col)||'0').replace(',','.'))||0; }

function formatFecha(raw){
  if(!raw) return "";
  // Si viene como DD/MM/YYYY (formato Google Sheets)
  const partes = raw.trim().split("/");
  if(partes.length === 3){
    const dia  = parseInt(partes[0]);
    const mes  = parseInt(partes[1]) - 1;
    const anio = parseInt(partes[2]);
    const d = new Date(anio, mes, dia);
    return d.toLocaleDateString("es-VE",{year:"numeric",month:"long",day:"numeric"});
  }
  // Si viene como número serial de Excel (fallback)
  const serial = parseFloat(raw);
  if(serial > 1000){
    const d = new Date((serial - 25569)*86400*1000);
    return d.toLocaleDateString("es-VE",{year:"numeric",month:"long",day:"numeric"});
  }
  return raw;
}

function tagTiempo(errores){
  if(errores===0) return '<span class="tag t-bien">Sin errores</span>';
  if(errores<=1)  return '<span class="tag t-regular">Regular</span>';
  return '<span class="tag t-mal">Necesita mejorar</span>';
}
function tagGral(val){
  const v2=val.toLowerCase();
  if(v2==='bien')    return '<span class="tag t-bien">Bien</span>';
  if(v2==='regular') return '<span class="tag t-regular">Regular</span>';
  if(v2==='mal')     return '<span class="tag t-mal">Mal</span>';
  return '<span class="tag t-regular">'+val+'</span>';
}

async function consultar(){
  hideErr();
  const grupoId = document.getElementById("sel-grupo").value;
  const cedula  = document.getElementById("inp-cedula").value.trim();
  const codigo  = document.getElementById("inp-codigo").value.trim();

  if(!grupoId){ showErr("Selecciona tu grupo."); return; }
  if(!cedula)  { showErr("Ingresa tu cédula."); return; }
  if(!codigo)  { showErr("Ingresa el código del grupo."); return; }

  const g = CFG.grupos.find(x=>x.id===grupoId);
  if(!g || g.codigo.toLowerCase()!==codigo.toLowerCase()){
    showErr("Código incorrecto. Consulta a tu instructor."); return;
  }

  // MODO DEMO — solo si no hay URL configurada
  if(!g.sheet || g.sheet==="PEGA_AQUI_LA_URL_CSV_DE_GOOGLE_SHEETS"){
    mostrarDemo(cedula, g); return;
  }

  document.getElementById("login-card").style.display="none";
  document.getElementById("loading").style.display="flex";

  try{
    const resp = await fetch(g.sheet);
    if(!resp.ok) throw new Error();
    const txt  = await resp.text();
    const data = parseCSV(txt);

    const alumno = data.find(r=>
      v(r,"cedula").replace(/\s/g,"")===cedula.replace(/\s/g,"") &&
      v(r,"grupo_examen").toLowerCase().trim()===grupoId.toLowerCase().trim()
    );

    document.getElementById("loading").style.display="none";

    if(!alumno){
      document.getElementById("login-card").style.display="block";
      showErr("No encontramos tu cédula en este grupo. Revisa el número o consulta a tu instructor.");
      return;
    }
    mostrarResultado(alumno, g);

  } catch(e){
    document.getElementById("loading").style.display="none";
    document.getElementById("login-card").style.display="block";
    showErr("Error al conectar con la base de datos. Intenta de nuevo.");
  }
}

  const tieneCoreografia = v(r,"coreografia").trim() !== "" || v(r,"secuencia").trim() !== "";
  const totalCoreo      = secuencia + coreografia;
  
  // Prueba Acumulativa (fase independiente)
  const prueba_acumulativa = n(r,"prueba_acumulativa");
  const tieneprueba_acumulativa = v(r,"prueba_acumulativa").trim() !== "";
  
  // Totales
  const totGral  = n(r,"total_general");
  const asistencia= n(r,"asistencia");
  const notaFinal = n(r,"nota_final");
  const resultado = v(r,"resultado_final").toLowerCase();
  const aprobado  = resultado==="aprobado";

  // ── Construir HTML ──
  let html = `
  <div class="res-header">
    <div class="exam-label">${formatTexto(disciplina)}${nivel ? " · " + formatTexto(nivel) : ""}</div>
    <h2>${nombre}</h2>
    ${pareja ? `<div class="pareja-line">Pareja: <span>${pareja}</span></div>` : ""}
    <br>
    <span class="fecha-badge">📅 ${fecha}</span>
  </div>`;

  // ─ FASE 1 ─
  let f1body = "";

  // Tiempo
  if(errT>0){
    f1body += `<div class="row"><span class="rl">Errores de tiempo</span>
      <span class="rv">${errT} error${errT>1?"es":""} ${tagTiempo(errT)}</span></div>`;
  } else {
    f1body += `<div class="row"><span class="rl">Tiempo</span>
      <span class="rv">${tagTiempo(0)}</span></div>`;
  }

  // Pasos regulares
  if(totReg>0 && pReg){
    const badges = pReg.split(",").map(p=>`<span class="badge badge-regular">${p.trim()}</span>`).join("");
    f1body += `<div class="row" style="flex-direction:column;gap:.4rem;">
      <div style="display:flex;justify-content:space-between;">
        <span class="rl">Pasos regulares</span>
        <span class="rv" style="display:flex;align-items:center;gap:.6rem;margin-left:1.2rem;">${totReg} paso${totReg>1?"s":""} <span class="tag t-regular">−${(totReg*0.5).toFixed(1)} pts</span></span>
      </div>
      <div class="badges">${badges}</div>
    </div>`;
  } else {
    f1body += `<div class="row"><span class="rl">Pasos regulares</span>
      <span class="rv"><span style="color:rgba(250,243,224,.7);font-style:italic;">✨ Sin errores graves considerables</span></span></div>`;
  }

  // Pasos malos
  if(totMal>0 && pMal){
    const badges = pMal.split(",").map(p=>`<span class="badge badge-malo">${p.trim()}</span>`).join("");
    f1body += `<div class="row" style="flex-direction:column;gap:.4rem;">
      <div style="display:flex;justify-content:space-between;">
        <span class="rl">Pasos malos</span>
        <span class="rv" style="display:flex;align-items:center;gap:.6rem;margin-left:1.2rem;">${totMal} paso${totMal>1?"s":""} <span class="tag t-mal">−${totMal} pts</span></span>
      </div>
      <div class="badges">${badges}</div>
    </div>`;
  } else {
    f1body += `<div class="row"><span class="rl">Pasos malos</span>
      <span class="rv"><span style="color:rgba(250,243,224,.7);font-style:italic;">✨ Sin errores graves considerables</span></span></div>`;
  }

  // Oral (solo si tiene valor)
  if(tieneOral){
    const oralFmt = Number.isInteger(oral) ? oral.toString() : parseFloat(oral.toFixed(2)).toString();
    f1body += `<div class="row"><span class="rl">Oral</span><span class="rv">${oralFmt} puntos</span></div>`;
  }



  html += `<div class="fase">
    <div class="fase-head">
      <h3>🕺 Fase Individual</h3>
      <span class="fase-score">${Number.isInteger(totF1) ? totF1 : totF1.toFixed(2).replace(/\.?0+$/,"")} puntos</span>
    </div>
    <div class="fase-body">${f1body}</div>
  </div>`;

  // ─ FASE 2 ─
  let f2body = `<div class="row"><span class="rl">1era canción</span><span class="rv">${tagCancion(c1)}</span></div>`;
  f2body += `<div class="row"><span class="rl">2da canción</span><span class="rv">${tagCancion(c2)}</span></div>`;
  f2body += `<div class="row"><span class="rl">3era canción</span><span class="rv">${tagCancion(c3)}</span></div>`;

  const totalMusicalFmt = Number.isInteger(totalMusical) ? totalMusical.toString() : parseFloat(totalMusical.toFixed(2)).toString();

  html += `<div class="fase">
    <div class="fase-head">
      <h3>🎵 Fase Musical</h3>
      <span class="fase-score">${totalMusicalFmt} puntos</span>
    </div>
    <div class="fase-body">${f2body}</div>
  </div>`;

  // ─ FASE SOCIAL — independiente ─
  if(tieneFaseSocial){
    let fSocialBody = "";

    // Social (puntaje base)
    fSocialBody += `<div class="row"><span class="rl">Social</span><span class="rv">${social} pts</span></div>`;

    // Tiempo social — mismo formato que tiempo en Fase 1
    if(tiempoSocial > 0){
      fSocialBody += `<div class="row"><span class="rl">Errores de tiempo</span>
        <span class="rv">${tiempoSocial} error${tiempoSocial>1?"es":""} ${tagTiempo(tiempoSocial)}</span></div>`;
    } else {
      fSocialBody += `<div class="row"><span class="rl">Tiempo</span>
        <span class="rv">${tagTiempo(0)}</span></div>`;
    }

    const faseSocialFmt = Number.isInteger(faseSocial) ? faseSocial.toString() : parseFloat(faseSocial.toFixed(2)).toString();
    html += `<div class="fase">
      <div class="fase-head">
        <h3>💃 Fase Social</h3>
        <span class="fase-score">${faseSocialFmt} puntos</span>
      </div>
      <div class="fase-body">${fSocialBody}</div>
    </div>`;
  }

  // ─ FASE 4 — Rueda ─
  if(tRueda>0){
    let f4body="";
    if(tRuedaTxt) f4body+=`<div class="row"><span class="rl">Tiempo</span><span class="rv">${tagGral(tRuedaTxt)}</span></div>`;
    if(pvdTxt)    f4body+=`<div class="row"><span class="rl">Proyección y dominio</span><span class="rv">${tagGral(pvdTxt)}</span></div>`;
    if(senasTxt)  f4body+=`<div class="row"><span class="rl">Señas</span><span class="rv">${tagGral(senasTxt)}</span></div>`;
    if(guia)          f4body+=`<div class="row" style="flex-direction:column;gap:.35rem;"><span class="rl">Pasos como guía</span><div class="badges">${guia.split(",").map(p=>`<span class="badge badge-malo">${p.trim()}</span>`).join("")}</div></div>`;
    else if(guiaEsCero) f4body+=`<div class="row"><span class="rl">Pasos como guía</span><span class="rv"><span style="color:rgba(250,243,224,.7);font-style:italic;">✨ Sin errores graves considerables</span></span></div>`;
    if(parti)           f4body+=`<div class="row" style="flex-direction:column;gap:.35rem;"><span class="rl">Pasos como participante</span><div class="badges">${parti.split(",").map(p=>`<span class="badge badge-malo">${p.trim()}</span>`).join("")}</div></div>`;
    else if(partiEsCero) f4body+=`<div class="row"><span class="rl">Pasos como participante</span><span class="rv"><span style="color:rgba(250,243,224,.7);font-style:italic;">✨ Sin errores graves considerables</span></span></div>`;

    html += `<div class="fase">
      <div class="fase-head">
        <h3>🔄 Fase Grupal – Rueda</h3>
        <span class="fase-score">${tRueda} pts</span>
      </div>
      <div class="fase-body">${f4body}</div>
    </div>`;
  }
  // ─ FASE BACHATA TRADICIONAL ─
  if(tienepasos_libres){
    const plFmt = Number.isInteger(plibres) ? plibres.toString() : parseFloat(plibres.toFixed(2)).toString();
    html += `<div class="fase">
      <div class="fase-head">
        <h3>🕺 Fase Bachata Tradicional</h3>
        <span class="fase-score">${plFmt} puntos</span>
      </div>
    </div>`;
  }
  
  // ─ FASE COREOGRAFICA ─
  if(tieneCoreografia){
    let fCoreoBody = "";
    if(v(r,"secuencia").trim() !== ""){
      fCoreoBody += `<div class="row"><span class="rl">Secuencia</span><span class="rv">${secuencia} pts</span></div>`;
    }
    if(v(r,"coreografia").trim() !== ""){
      fCoreoBody += `<div class="row"><span class="rl">Montaje</span><span class="rv">${coreografia} pts</span></div>`;
    }
    const totalCoreoFmt = Number.isInteger(totalCoreo) ? totalCoreo.toString() : parseFloat(totalCoreo.toFixed(2)).toString();
    html += `<div class="fase">
      <div class="fase-head">
        <h3>🎭 Fase Coreográfica</h3>
        <span class="fase-score">${totalCoreoFmt} puntos</span>
      </div>
      <div class="fase-body">${fCoreoBody}</div>
    </div>`;
  }
  
  // ─ CUADRO RESUMEN ─
  function fmt(num){ return Number.isInteger(num) ? num.toString() : parseFloat(num.toFixed(2)).toString(); }
  let resumenRows = "";
  resumenRows += `<div class="resumen-row"><span class="res-fase">Fase Individual</span><span class="res-pts">${fmt(totF1)} puntos</span></div>`;
  resumenRows += `<div class="resumen-row"><span class="res-fase">Fase Musical</span><span class="res-pts">${fmt(totalMusical)} puntos</span></div>`;
  if(tieneFaseSocial) resumenRows += `<div class="resumen-row"><span class="res-fase">Fase Social</span><span class="res-pts">${fmt(faseSocial)} puntos</span></div>`;
  if(tRueda>0) resumenRows += `<div class="resumen-row"><span class="res-fase">Fase Grupal – Rueda</span><span class="res-pts">${fmt(tRueda)} puntos</span></div>`;
  if(tienepasos_libres) resumenRows += `<div class="resumen-row"><span class="res-fase">Fase Bachata Tradicional</span><span class="res-pts">${fmt(plibres)} puntos</span></div>`;
  if(tieneCoreografia) resumenRows += `<div class="resumen-row"><span class="res-fase">Fase Coreográfica</span><span class="res-pts">${fmt(totalCoreo)} puntos</span></div>`;
  if(asistencia>0) resumenRows += `<div class="resumen-row"><span class="res-fase">Asistencia y Puntualidad</span><span class="res-pts">${fmt(asistencia)} puntos</span></div>`;
  if(prueba_acumulativa>0) resumenRows += `<div class="resumen-row"><span class="res-fase">Prueba acumulativa</span><span class="res-pts">${fmt(prueba_acumulativa)} puntos</span></div>`;
  html += `<div class="resumen-box">
    <div class="resumen-title">📊 Resumen de Puntuación</div>
    ${resumenRows}
  </div>`;

  // ─ TOTAL FINAL ─
  html += `<div class="total-box">
    <div>
      <div class="tl">Nota Final</div>
      <div style="font-size:.75rem;color:rgba(250,243,224,.4);margin-top:.2rem;">Mínimo para aprobar: ${CFG.minAprobado} pts</div>
    </div>
    <div class="tn">${Number.isInteger(notaFinal) ? notaFinal : notaFinal.toFixed(2).replace(/\.?0+$/,"")}</div>
  </div>`;

  // ─ BANNER RESULTADO ─
  if(aprobado){
    html += `<div class="banner aprobado">
      <strong>🎉 ¡Felicidades, ${nombre.split(" ")[0]}!</strong>
      La nota obtenida en tu examen de culminación te permite <strong>APROBAR</strong> el nivel Plata de Bachata
      y otorga el pase al siguiente nivel: <strong>ORO🏅</strong> <br>
      ¡Estamos orgullosos de ti! <br>
      Sigamos trabajando, bailando y mejorando cada día más. 💪🏼
      <span class="handle">@HavanaSalsaClub</span>
    </div>`;
  } else {
    html += `<div class="banner reprobado">
      <strong>📋 Resultado: No Aprobado</strong>
      Tu nota en esta evaluación no alcanzó el mínimo de ${CFG.minAprobado} puntos.
      ¡No te desanimes! Cada práctica es un paso más. Consulta a tu instructor para seguir mejorando. 💪
      <span class="handle">@HavanaSalsaClub</span>
    </div>`;
  }

  // ─ BTN VOLVER ─
  html += `<button class="btn-back" onclick="volver()">← Consultar otro alumno</button>`;

  const div = document.getElementById("result");
  div.innerHTML = html;
  div.style.display = "block";
  window.scrollTo({top:0,behavior:"smooth"});
}

    tiempo:"1",
    pasos_regulares:"Sombrero 1 mano, Prima Tía, Vacila con ella",total_regulares:"3",
    pasos_malos:"Trompo",total_malos:"1",total_fase_1:"10",

    tiempo_rueda:"regular",pv_d_rueda:"bien",senas_rueda:"regular",

  document.getElementById("result").style.display="none";
  document.getElementById("result").innerHTML="";
  document.getElementById("login-card").style.display="block";
  document.getElementById("inp-cedula").value="";
  document.getElementById("inp-codigo").value="";
  window.scrollTo({top:0,behavior:"smooth"});
